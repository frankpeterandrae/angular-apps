<!doctype html>
<html lang="en">
	<head lang="en">
		<title>Volume Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>

	<body>
		<sdpi-item label="Receiver IP">
			<sdpi-textfield global setting="receiverAddress" placeholder="192.168.178.67"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item label="Zone">
			<sdpi-select setting="zone" default="main" datasource="getVolumeZones" loading="Loading zones..." show-refresh hot-reload>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item label="Direction">
			<sdpi-select setting="direction" default="up">
				<option value="up">Volume Up</option>
				<option value="down">Volume Down</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
